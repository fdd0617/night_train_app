<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89cff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Moon -->
  <circle cx="200" cy="200" r="84" fill="url(#moon)"/>
  <circle cx="232" cy="184" r="72" fill="#0f1117"/>
  <!-- Train track -->
  <rect x="84" y="356" width="344" height="6" rx="3" fill="#6c63ff" opacity="0.45"/>
  <rect x="84" y="376" width="344" height="3" rx="1.5" fill="#6c63ff" opacity="0.25"/>
  <!-- Train body -->
  <rect x="120" y="296" width="272" height="60" rx="14" fill="#6c63ff"/>
  <rect x="138" y="310" width="44" height="22" rx="4" fill="#a89cff"/>
  <rect x="194" y="310" width="44" height="22" rx="4" fill="#a89cff"/>
  <rect x="250" y="310" width="44" height="22" rx="4" fill="#a89cff"/>
  <rect x="306" y="310" width="44" height="22" rx="4" fill="#a89cff"/>
  <!-- Wheels -->
  <circle cx="160" cy="362" r="14" fill="#1a1d27" stroke="#6c63ff" stroke-width="3"/>
  <circle cx="220" cy="362" r="14" fill="#1a1d27" stroke="#6c63ff" stroke-width="3"/>
  <circle cx="290" cy="362" r="14" fill="#1a1d27" stroke="#6c63ff" stroke-width="3"/>
  <circle cx="350" cy="362" r="14" fill="#1a1d27" stroke="#6c63ff" stroke-width="3"/>
  <!-- Stars -->
  <circle cx="380" cy="120" r="3" fill="#fff" opacity="0.85"/>
  <circle cx="416" cy="180" r="2" fill="#fff" opacity="0.65"/>
  <circle cx="100" cy="100" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="60"  cy="200" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="60"  r="2" fill="#fff" opacity="0.6"/>
</svg>
